[package]
name = "ai-marketing"
version = "0.1.0"
description = "AI Marketing local Windows workbench"
authors = ["AI Marketing"]
edition = "2021"

[lib]
name = "ai_marketing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.10"
regex = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
