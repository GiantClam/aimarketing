<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/brand/ai-marketing-icon-64.png" />
    <title>AI Marketing</title>
  </head>
  <body>
    <div id="root">
      <main id="boot-fallback" aria-live="polite">
        <div class="boot-fallback-card">
          <div class="boot-fallback-mark">AI</div>
          <div class="boot-fallback-kicker">LOCAL RUNTIME BOOTSTRAP</div>
          <h1>正在启动本地工作台</h1>
          <p>正在加载桌面运行桥接与本地组件…</p>
          <div class="boot-fallback-progress" aria-hidden="true"><span></span></div>
        </div>
      </main>
    </div>
    <style>
      html, body { margin: 0; min-height: 100%; background: #fdfdfb; color: #111; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      #boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(90deg, rgba(17,17,17,.025) 1px, transparent 1px), linear-gradient(rgba(17,17,17,.025) 1px, transparent 1px); background-size: 42px 42px; }
      .boot-fallback-card { width: min(100%, 580px); border: 1px solid #e5e5e0; border-radius: 18px; padding: 30px; background: #fff; box-shadow: 0 24px 70px rgba(17,17,17,.09); }
      .boot-fallback-mark { display: grid; width: 56px; height: 56px; place-items: center; border-radius: 14px; background: #ffd000; font-weight: 900; }
      .boot-fallback-kicker { margin-top: 20px; color: #777; font-size: 10px; font-weight: 800; letter-spacing: .16em; }
      .boot-fallback-card h1 { margin: 8px 0 0; font-size: 32px; line-height: 1; }
      .boot-fallback-card p { margin: 16px 0 0; color: #777; line-height: 1.6; }
      .boot-fallback-progress { height: 5px; margin-top: 24px; overflow: hidden; border-radius: 999px; background: #efefea; }
      .boot-fallback-progress span { display: block; width: 42%; height: 100%; border-radius: inherit; background: #ffd000; animation: boot-fallback-progress 1.4s ease-in-out infinite; }
      @keyframes boot-fallback-progress { 0%, 100% { transform: translateX(-110%); } 50% { transform: translateX(250%); } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
