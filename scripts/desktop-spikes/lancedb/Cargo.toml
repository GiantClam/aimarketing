[package]
name = "windows-lancedb-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
arrow-array = "58.0.0"
arrow-schema = "58.0.0"
futures = "0.3"
lancedb = { version = "0.37.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.24"

